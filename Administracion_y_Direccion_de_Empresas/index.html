<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Simulador local de autoevaluación de Administración y Dirección de Empresas.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'">
    <link rel="stylesheet" href="styles.css">
    <title>Simulador ADE | NainDev</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">NainDev</a>
      <a class="back-link" href="/">Volver al portafolio</a>
    </header>

    <main class="quiz-shell">
      <section class="quiz-intro">
        <p class="eyebrow">Herramienta de estudio</p>
        <h1>Simulador ADE</h1>
        <p>Autoevaluación basada en el banco de preguntas incluido en este repositorio.</p>
      </section>

      <section class="quiz-card" aria-labelledby="question-text">
        <div class="question-meta">
          <span data-question-source>Preparando pregunta…</span>
          <span data-question-count></span>
        </div>
        <h2 id="question-text" data-question-text>Cargando banco de preguntas…</h2>
        <div class="options" data-options></div>
        <div class="feedback" data-feedback role="status" aria-live="polite" hidden></div>
        <button class="next-button" type="button" data-next-question hidden>Siguiente pregunta</button>
      </section>
    </main>

    <footer>
      <p>© 2026 NainDev · Herramienta educativa local</p>
    </footer>

    <script src="preguntas.js"></script>
    <script src="app.js"></script>
  </body>
</html>
