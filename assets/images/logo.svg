<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <mask id="corteN">
      <!-- Fondo blanco: todo lo que es blanco será visible -->
      <rect width="500" height="500" fill="white" />
      <!-- El stroke negro recorta un borde transparente alrededor de la diagonal -->
      <polygon points="75,75 200,75 425,425 300,425" fill="none" stroke="black" stroke-width="25" stroke-linejoin="miter" />
    </mask>
  </defs>
  
  <!-- Pilares verticales (Backend) - Sometidos a la máscara -->
  <g mask="url(#corteN)">
    <rect x="75" y="75" width="125" height="350" fill="#0047AB" rx="5" />
    <rect x="300" y="75" width="125" height="350" fill="#0047AB" rx="5" />
  </g>
  
  <!-- Diagonal (Flujo IA) - Situada por encima sin máscara -->
  <polygon points="75,75 200,75 425,425 300,425" fill="#00BFFF" stroke-linejoin="miter" />
</svg>
