name: SEO host audit

# Weekly check that every public host still meets the discoverability baseline
# (specs/next-seo-host-audit). A failed run is the alert: GitHub notifies the owner.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit public hosts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit hosts
        run: node scripts/audit-hosts.mjs
