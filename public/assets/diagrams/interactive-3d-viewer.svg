<svg viewBox="0 0 720 320" role="img" aria-labelledby="v3-title v3-desc" data-translate="yes" xmlns="http://www.w3.org/2000/svg">
  <title id="v3-title">Arquitectura del visor 3D</title>
  <desc id="v3-desc">La página anfitriona monta el Web Component y le pasa un perfil JSON. El componente aísla su interfaz en Shadow DOM y comprueba la integridad del modelo con un hash SHA-256 ligado a la conformidad determinista antes de cargarlo. La descompresión Draco corre en un Web Worker y el motor Three.js renderiza en móvil y escritorio. Los perfiles activan la inspección industrial, el despiece procedimental y el marcado de daños. Pruebas E2E y visuales con Playwright y accesibilidad WCAG 2.2 AA.</desc>
  <defs>
    <marker id="v3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow" /></marker>
    <marker id="v3-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow-accent" /></marker>
  </defs>
  <rect class="node" x="20" y="40" width="200" height="64" rx="8" />
  <text class="label" x="120" y="66" text-anchor="middle">Página anfitriona</text>
  <text class="label-soft" x="120" y="88" text-anchor="middle">cualquier web · perfil JSON</text>
  <rect class="node node-accent" x="260" y="40" width="200" height="64" rx="8" />
  <text class="label" x="360" y="66" text-anchor="middle">Web Component</text>
  <text class="label-soft" x="360" y="88" text-anchor="middle">Shadow DOM aislado · ultraligero</text>
  <rect class="node" x="500" y="40" width="200" height="64" rx="8" />
  <text class="label" x="600" y="66" text-anchor="middle">Puerta de integridad</text>
  <text class="label-soft" x="600" y="88" text-anchor="middle">hash SHA-256 · conformidad</text>
  <rect class="node" x="500" y="216" width="200" height="64" rx="8" />
  <text class="label" x="600" y="242" text-anchor="middle">Descompresión Draco</text>
  <text class="label-soft" x="600" y="264" text-anchor="middle">en un Web Worker</text>
  <rect class="node" x="260" y="216" width="200" height="64" rx="8" />
  <text class="label" x="360" y="242" text-anchor="middle">Motor Three.js</text>
  <text class="label-soft" x="360" y="264" text-anchor="middle">móvil y escritorio</text>
  <rect class="node" x="20" y="216" width="200" height="64" rx="8" />
  <text class="label" x="120" y="242" text-anchor="middle">Modos de uso</text>
  <text class="label-soft" x="120" y="264" text-anchor="middle">inspección · despiece · daños</text>
  <rect class="node" x="20" y="128" width="200" height="56" rx="8" stroke-dasharray="4 4" />
  <text class="label" x="120" y="152" text-anchor="middle">Pruebas</text>
  <text class="label-soft" x="120" y="172" text-anchor="middle">Playwright · WCAG 2.2 AA</text>
  <path class="flow" d="M220 72H258" marker-end="url(#v3-arrow)" />
  <path class="flow" d="M460 72H498" marker-end="url(#v3-arrow)" />
  <path class="flow" d="M600 104V214" marker-end="url(#v3-arrow)" />
  <path class="flow" d="M500 248H462" marker-end="url(#v3-arrow)" />
  <path class="flow flow-accent" d="M260 248H222" marker-end="url(#v3-arrow-accent)" />
  <path class="flow" d="M220 156H360V106" marker-end="url(#v3-arrow)" stroke-dasharray="4 4" />
</svg>
