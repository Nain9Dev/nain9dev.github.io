<svg viewBox="0 0 720 320" role="img" aria-labelledby="cr-title cr-desc" data-translate="yes" xmlns="http://www.w3.org/2000/svg">
  <title id="cr-title">Arquitectura del CRM colaborativo</title>
  <desc id="cr-desc">Un cliente Vue 3 con TypeScript habla con una API FastAPI sobre PostgreSQL. Cada entidad lleva su versión: si dos usuarios editan a la vez, la API responde con un conflicto HTTP 409 y el cliente fusiona campo a campo sin perder datos. Los duplicados se bloquean con citext e índices únicos parciales, y el registro de actividad se escribe en la misma transacción que el cambio. Todo se despliega con Docker a coste operativo cero.</desc>
  <defs>
    <marker id="cr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow" /></marker>
    <marker id="cr-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow-accent" /></marker>
  </defs>
  <rect class="node" x="20" y="40" width="200" height="64" rx="8" />
  <text class="label" x="120" y="66" text-anchor="middle">Cliente Vue 3</text>
  <text class="label-soft" x="120" y="88" text-anchor="middle">TypeScript · Tailwind CSS</text>
  <rect class="node" x="260" y="40" width="200" height="64" rx="8" />
  <text class="label" x="360" y="66" text-anchor="middle">API FastAPI</text>
  <text class="label-soft" x="360" y="88" text-anchor="middle">SQLAlchemy · versión por entidad</text>
  <rect class="node" x="500" y="40" width="200" height="64" rx="8" />
  <text class="label" x="600" y="66" text-anchor="middle">PostgreSQL</text>
  <text class="label-soft" x="600" y="88" text-anchor="middle">citext · índices únicos parciales</text>
  <rect class="node node-accent" x="20" y="216" width="200" height="64" rx="8" />
  <text class="label" x="120" y="242" text-anchor="middle">Conflicto HTTP 409</text>
  <text class="label-soft" x="120" y="264" text-anchor="middle">fusión campo a campo</text>
  <rect class="node" x="260" y="216" width="200" height="64" rx="8" />
  <text class="label" x="360" y="242" text-anchor="middle">Registro de actividad</text>
  <text class="label-soft" x="360" y="264" text-anchor="middle">en la misma transacción</text>
  <rect class="node" x="500" y="216" width="200" height="64" rx="8" stroke-dasharray="4 4" />
  <text class="label" x="600" y="242" text-anchor="middle">Despliegue</text>
  <text class="label-soft" x="600" y="264" text-anchor="middle">Docker · coste operativo cero</text>
  <text class="label-soft" x="230" y="152" text-anchor="middle">versión obsoleta</text>
  <text class="label-soft" x="480" y="152" text-anchor="middle">mismo commit</text>
  <path class="flow" d="M220 72H258" marker-end="url(#cr-arrow)" />
  <path class="flow" d="M460 72H498" marker-end="url(#cr-arrow)" />
  <path class="flow" d="M300 104V160H160V214" marker-end="url(#cr-arrow)" />
  <path class="flow" d="M600 104V160H360V214" marker-end="url(#cr-arrow)" />
  <path class="flow flow-accent" d="M80 216V106" marker-end="url(#cr-arrow-accent)" stroke-dasharray="4 4" />
</svg>
