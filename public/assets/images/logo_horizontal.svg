<svg viewBox="0 0 1600 400" width="100%" height="100%">
    <defs>
      <mask id="corteN2">
        <rect width="1600" height="400" fill="white"></rect>
        <polygon points="60,60 160,60 340,340 240,340" fill="none" stroke="black" stroke-width="20" stroke-linejoin="miter"></polygon>
      </mask>
    </defs>
    <!-- Isotipo scaled to 340x340, centered vertically so top=30, bottom=370, height=280. Wait, 400 height.
         Let's do Isotipo box 400x400:
         x=0 to 400.
         rect1: x=60, y=60, w=100, h=280
         rect2: x=240, y=60, w=100, h=280
         poly: 60,60 160,60 340,340 240,340 -->
    <g mask="url(#corteN2)">
      <rect x="60" y="60" width="100" height="280" fill="#0047AB" rx="4"></rect>
      <rect x="240" y="60" width="100" height="280" fill="#0047AB" rx="4"></rect>
    </g>
    <polygon points="60,60 160,60 340,340 240,340" fill="#00BFFF" stroke-linejoin="miter"></polygon>
    
    <!-- Texto -->
    <!-- Text baseline at 290 -->
    <text x="400" y="295" font-size="240px">
      <tspan class="text-heavy">Nain</tspan><tspan class="text-light">Dev</tspan>
    </text>
  </svg>